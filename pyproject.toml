[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentriage-evals"
version = "0.1.0"
description = "Eval harness for an LLM on-call / alert-triage agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
judge = [
  "deepeval>=1.0",
]

[project.scripts]
opentriage-eval = "evals.runner:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["opentriage*", "evals*"]

[tool.setuptools.package-data]
opentriage = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
