name: eval-gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip setuptools wheel
          .venv/bin/pip install -e ".[dev]"

      - name: Unit tests
        run: make test

      - name: Golden split check
        run: make split-check

      - name: Eval CI gate (fixture mode)
        run: make eval-ci

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: artifacts/scorecard.json
